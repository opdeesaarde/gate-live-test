name: bot-pr
on: workflow_dispatch
permissions: {contents: write, pull-requests: write}
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -b bot-branch-$GITHUB_RUN_ID
          echo "bot $GITHUB_RUN_ID" > bot.txt
          git add bot.txt; git commit -m "bot change"
          git push origin HEAD
          gh pr create --title "bot pr" --body "dummy" --base main
        env: {GH_TOKEN: "${{ github.token }}"}

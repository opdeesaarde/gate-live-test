name: advisory-review
on: pull_request
permissions: {contents: read, pull-requests: write}
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run reviewer (rules come from main, never from the submission)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show origin/main:.github/review/run.sh > /tmp/run.sh
          git show origin/main:.github/review/prompt.md > /tmp/prompt.md
          git show origin/main:.github/review/schema.json > /tmp/schema.json
          bash /tmp/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: review-result, path: /tmp/review/}

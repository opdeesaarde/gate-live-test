name: gate-wf
on: pull_request
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: if [ -n "$S" ]; then echo PR_REPO_SECRET_REACHED; else echo PR_REPO_SECRET_EMPTY; fi
        env: {S: "${{ secrets.DUMMY_REPO_SECRET }}"}
  envjob:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: if [ -n "$S" ]; then echo PR_ENV_SECRET_REACHED; else echo PR_ENV_SECRET_EMPTY; fi
        env: {S: "${{ secrets.DUMMY_SECRET }}"}
